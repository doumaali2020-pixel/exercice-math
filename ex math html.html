<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercice QCM - Mathématiques 1ère année - Prof Douma Ali</title>
<style>
  /* ====== RESET & BASE ====== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, "Trebuchet MS", sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 50%, #00c6fb 100%);
    background-size: 400% 400%;
    animation: bgMove 18s ease infinite;
    min-height: 100vh;
    color: #2c3e50;
    overflow-x: hidden;
  }
  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ====== EN-TÊTE ====== */
  header {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    background: linear-gradient(90deg, #ff6a00, #ee0979, #6a11cb);
    padding: 10px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo-zone {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-zone img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 12px rgba(255,255,255,.8);
    object-fit: cover;
    background: #fff;
  }
  .title-zone {
    text-align: center;
  }
  .title-zone h1 {
    color: #fff;
    font-size: 1.5rem;
    text-shadow: 2px 2px 6px rgba(0,0,0,.5);
    letter-spacing: .5px;
  }
  .title-zone .sub {
    color: #ffe08a;
    font-size: .85rem;
    margin-top: 2px;
    font-weight: bold;
  }
  .name-zone {
    text-align: right;
    color: #fff;
    font-weight: bold;
    font-size: 1.05rem;
    text-shadow: 1px 1px 4px rgba(0,0,0,.5);
  }
  .name-zone .badge {
    background: #fff;
    color: #ee0979;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* ====== CONTENEUR PRINCIPAL ====== */
  main {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px 60px;
  }

  /* Barre de progression */
  .progress-wrap {
    background: rgba(255,255,255,.25);
    border-radius: 30px;
    height: 26px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.2);
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ff6a00, #ff3366);
    transition: width .5s ease;
    border-radius: 30px;
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    text-shadow: 1px 1px 3px rgba(0,0,0,.6);
    font-size: .9rem;
  }

  /* Carte question */
  .quiz-card {
    background: #fff;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 16px 40px rgba(0,0,0,.25);
    position: relative;
    overflow: hidden;
  }
  .quiz-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, #00c6fb, #2575fc, #6a11cb, #ee0979, #ff6a00);
  }

  .question-num {
    display: inline-block;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: .9rem;
    margin-bottom: 14px;
    box-shadow: 0 4px 10px rgba(106,17,203,.4);
  }
  .question-text {
    font-size: 1.4rem;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* Choix */
  .choices {
    display: grid;
    gap: 14px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #f6f9fc, #e9ecef);
    border: 2px solid #d0d7de;
    border-radius: 16px;
    padding: 16px 20px;
    cursor: pointer;
    font-size: 1.15rem;
    font-weight: 600;
    color: #2c3e50;
    transition: all .25s ease;
    user-select: none;
  }
  .choice:hover:not(.disabled) {
    background: linear-gradient(135deg, #fff3cd, #ffe08a);
    border-color: #ffc107;
    transform: translateX(6px);
    box-shadow: 0 6px 14px rgba(255,193,7,.4);
  }
  .choice .letter {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
  }
  .choice.correct {
    background: linear-gradient(135deg, #c8ffd4, #6ddc8a);
    border-color: #28a745;
    color: #155724;
    box-shadow: 0 6px 16px rgba(40,167,69,.4);
  }
  .choice.correct .letter { background: linear-gradient(135deg,#28a745,#20c997); }
  .choice.wrong {
    background: linear-gradient(135deg, #ffd6d6, #ff8a8a);
    border-color: #dc3545;
    color: #721c24;
    box-shadow: 0 6px 16px rgba(220,53,69,.4);
  }
  .choice.wrong .letter { background: linear-gradient(135deg,#dc3545,#e83e8c); }
  .choice.disabled { cursor: not-allowed; }
  .choice.disabled:hover { transform: none; }

  /* Zone de feedback */
  .feedback {
    margin-top: 22px;
    border-radius: 16px;
    padding: 18px 22px;
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
    display: none;
    animation: popIn .5s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .feedback.show { display: block; }
  .feedback.success {
    background: linear-gradient(135deg, #00e676, #00c853);
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,.3);
    box-shadow: 0 6px 18px rgba(0,200,83,.5);
    animation: popIn .5s ease, shake .5s ease;
  }
  .feedback.error {
    background: linear-gradient(135deg, #ff5252, #d32f2f);
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,.3);
    box-shadow: 0 6px 18px rgba(211,47,47,.5);
  }
  @keyframes shake {
    0%,100% { transform: scale(1); }
    25% { transform: scale(1.05) rotate(-1deg); }
    75% { transform: scale(1.05) rotate(1deg); }
  }

  /* Correction */
  .correction {
    margin-top: 16px;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    border-left: 6px solid #1976d2;
    border-radius: 12px;
    padding: 16px 20px;
    display: none;
    animation: slideDown .4s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .correction.show { display: block; }
  .correction h3 {
    color: #1565c0;
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .correction p {
    color: #263238;
    font-size: 1.05rem;
    line-height: 1.6;
  }
  .correction .answer {
    display: inline-block;
    background: #1565c0;
    color: #fff;
    padding: 3px 12px;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 6px;
  }

  /* Bouton suivant */
  .actions {
    margin-top: 26px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    transition: all .25s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .btn-next {
    background: linear-gradient(135deg, #ff6a00, #ee0979);
  }
  .btn-next:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 22px rgba(238,9,121,.5);
  }
  .btn-next:disabled {
    background: #b0bec5;
    cursor: not-allowed;
    box-shadow: none;
    opacity: .7;
  }
  .btn-restart {
    background: linear-gradient(135deg, #00c6fb, #2575fc);
  }
  .btn-restart:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 22px rgba(37,117,252,.5);
  }

  /* Score final */
  .final-card {
    text-align: center;
    padding: 50px 30px;
  }
  .final-card h2 {
    font-size: 2rem;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #6a11cb, #ee0979);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .final-card .score {
    font-size: 3rem;
    font-weight: bold;
    color: #ff6a00;
    margin: 20px 0;
  }
  .final-card .msg {
    font-size: 1.3rem;
    color: #2c3e50;
    margin-bottom: 20px;
  }

  /* ====== JEU DE LUMIÈRE ====== */
  .lightshow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1000;
    display: none;
    overflow: hidden;
  }
  .lightshow.active { display: block; }
  .light {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    opacity: 0;
  }
  .sparkle {
    position: absolute;
    font-size: 28px;
    opacity: 0;
  }

  @keyframes lightBurst {
    0% { opacity: 0; transform: scale(0); }
    30% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(2.5); }
  }
  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    20% { opacity: 1; transform: translateY(-30px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-200px) scale(.5); }
  }

  /* Confettis */
  .confetti {
    position: absolute;
    width: 12px; height: 12px;
    opacity: 0;
  }

  footer {
    text-align: center;
    color: rgba(255,255,255,.85);
    font-size: .85rem;
    padding: 16px;
  }

  /* ====== BOUTON COPIER LE CODE ====== */
  .copy-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 60;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: .95rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(17,153,142,.45);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all .25s ease;
  }
  .copy-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 24px rgba(56,239,125,.55);
  }
  .copy-btn .ico { font-size: 1.1rem; }

  /* Toast de confirmation */
  .toast {
    position: fixed;
    bottom: 80px;
    right: 20px;
    z-index: 70;
    background: #2c3e50;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: .95rem;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    opacity: 0;
    transform: translateY(10px);
    transition: all .3s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.success { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .toast.error { background: linear-gradient(135deg, #ff5252, #d32f2f); }

  @media (max-width: 600px) {
    header { grid-template-columns: 1fr 1.5fr 1fr; padding: 8px; }
    .logo-zone img { width: 50px; height: 50px; }
    .title-zone h1 { font-size: 1rem; }
    .name-zone { font-size: .8rem; }
    .question-text { font-size: 1.15rem; }
    .choice { font-size: 1rem; padding: 12px 14px; }
    .quiz-card { padding: 20px 16px; }
  }
</style>
</head>

      <div class="progress-text" id="progressText">Question 1 / 20</div>
    </div>

    <div class="quiz-card" id="quizCard">
    <span class="question-num">Question 1 / 20</span>
    <div class="question-text">Calculer : 15 + 27 = ?</div>
    <div class="choices" id="choices">
      
        <div class="choice" data-index="0" onclick="selectChoice(0)">
          <div class="letter">A</div>
          <div class="text">41</div>
        </div>
      
        <div class="choice" data-index="1" onclick="selectChoice(1)">
          <div class="letter">B</div>
          <div class="text">42</div>
        </div>
      
        <div class="choice" data-index="2" onclick="selectChoice(2)">
          <div class="letter">C</div>
          <div class="text">43</div>
        </div>
      
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="correction" id="correction">
      <h3>Correction</h3>
      <p id="correctionText"></p>
    </div>
    <div class="actions">
      <button class="btn btn-next" id="nextBtn" disabled="" onclick="nextQuestion()">
        Passer à la question suivante
      </button>
    </div>
  </div>
  </main>

  <footer>
    © Exercice QCM — Conçu par Prof Douma Ali
  </footer>

  <!-- BOUTON COPIER LE CODE HTML -->
  <button class="copy-btn" onclick="copyHtmlCode()">
    <span class="ico">📋</span>
    <span>Copier le code HTML</span>
  </button>

  <!-- TOAST DE CONFIRMATION -->
  <div class="toast" id="toast"></div>

  <!-- JEU DE LUMIÈRE -->
  <div class="lightshow" id="lightshow"></div>

<script>
/* ====================================================================
   DONNÉES DU QCM — 20 questions, 3 choix, 1 correcte + correction
   ==================================================================== */
const questions = [
  {
    q: "Calculer : 15 + 27 = ?",
    choices: ["41", "42", "43"],
    correct: 1,
    correction: "15 + 27 = 42. On additionne les unités (5+7=12, on pose 2 et on retient 1) puis les dizaines (1+2+1=4)."
  },
  {
    q: "Calculer : 8 × 7 = ?",
    choices: ["54", "56", "58"],
    correct: 1,
    correction: "8 × 7 = 56. C'est une table de multiplication classique : 7 fois 8 donnent 56."
  },
  {
    q: "Quel est le résultat de 144 ÷ 12 ?",
    choices: ["11", "12", "13"],
    correct: 1,
    correction: "144 ÷ 12 = 12. En effet 12 × 12 = 144, donc 144 divisé par 12 vaut 12."
  },
  {
    q: "Résoudre l'équation : x + 5 = 12. La valeur de x est ?",
    choices: ["6", "7", "8"],
    correct: 1,
    correction: "x = 12 − 5 = 7. Pour isoler x, on soustrait 5 des deux côtés de l'équation."
  },
  {
    q: "L'aire d'un carré de côté 5 cm est :",
    choices: ["20 cm²", "25 cm²", "10 cm²"],
    correct: 1,
    correction: "Aire = côté × côté = 5 × 5 = 25 cm². L'aire d'un carré est le carré de la longueur de son côté."
  },
  {
    q: "Le périmètre d'un rectangle de longueur 8 cm et largeur 3 cm est :",
    choices: ["22 cm", "24 cm", "11 cm"],
    correct: 0,
    correction: "Périmètre = 2 × (longueur + largeur) = 2 × (8 + 3) = 2 × 11 = 22 cm."
  },
  {
    q: "Calculer : 3/4 + 1/4 = ?",
    choices: ["1", "3/4", "4/8"],
    correct: 0,
    correction: "3/4 + 1/4 = 4/4 = 1. Les fractions ont même dénominateur, on additionne les numérateurs."
  },
  {
    q: "Calculer : 2/3 × 3/2 = ?",
    choices: ["1", "6/6", "0"],
    correct: 0,
    correction: "(2×3)/(3×2) = 6/6 = 1. Le produit de deux fractions inverses donne toujours 1."
  },
  {
    q: "Que vaut 2³ (deux au cube) ?",
    choices: ["6", "8", "9"],
    correct: 1,
    correction: "2³ = 2 × 2 × 2 = 8. L'exposant 3 signifie qu'on multiplie 2 par lui-même trois fois."
  },
  {
    q: "Calculer √64 (racine carrée de 64) :",
    choices: ["6", "7", "8"],
    correct: 2,
    correction: "√64 = 8 car 8 × 8 = 64. La racine carrée d'un nombre est la valeur qui, multipliée par elle-même, donne ce nombre."
  },
  {
    q: "Combien font 50 % de 80 ?",
    choices: ["30", "40", "50"],
    correct: 1,
    correction: "50 % de 80 = (50/100) × 80 = 0,5 × 80 = 40. 50 % représente la moitié."
  },
  {
    q: "Un angle droit mesure :",
    choices: ["60°", "90°", "180°"],
    correct: 1,
    correction: "Un angle droit mesure 90°. C'est l'angle formé par deux droites perpendiculaires."
  },
  {
    q: "Combien de côtés possède un triangle ?",
    choices: ["2", "3", "4"],
    correct: 1,
    correction: "Un triangle possède 3 côtés, 3 sommets et 3 angles. La somme de ses angles vaut 180°."
  },
  {
    q: "Calculer : 7² (sept au carré) = ?",
    choices: ["14", "49", "47"],
    correct: 1,
    correction: "7² = 7 × 7 = 49. L'exposant 2 signifie qu'on multiplie 7 par lui-même deux fois."
  },
  {
    q: "Quel est le nombre premier qui suit directement 7 ?",
    choices: ["9", "10", "11"],
    correct: 2,
    correction: "11. Les nombres premiers sont divisibles seulement par 1 et eux-mêmes. 9 = 3×3 et 10 = 2×5 ne sont pas premiers."
  },
  {
    q: "Calculer : 100 − 37 = ?",
    choices: ["63", "73", "67"],
    correct: 0,
    correction: "100 − 37 = 63. On soustrait les unités et les dizaines : 100 − 30 − 7 = 70 − 7 = 63."
  },
  {
    q: "Calculer : 9 × 9 = ?",
    choices: ["18", "81", "99"],
    correct: 1,
    correction: "9 × 9 = 81. C'est le dernier produit de la table de 9."
  },
  {
    q: "La fraction 1/2 exprimée en décimal donne :",
    choices: ["0,2", "0,5", "1,2"],
    correct: 1,
    correction: "1/2 = 0,5. La moitié d'une unité correspond à 0,5 en écriture décimale."
  },
  {
    q: "Quel est le double de 15 ?",
    choices: ["25", "30", "45"],
    correct: 1,
    correction: "Le double de 15 est 15 × 2 = 30. Doubler un nombre revient à le multiplier par 2."
  },
  {
    q: "Calculer 5! (factorielle de 5) :",
    choices: ["20", "25", "120"],
    correct: 2,
    correction: "5! = 5 × 4 × 3 × 2 × 1 = 120. La factorielle d'un entier est le produit de tous les entiers de 1 jusqu'à ce nombre."
  }
];

/* ====================================================================
   ÉTAT
   ==================================================================== */
let currentIndex = 0;
let score = 0;
let answered = false;

const quizCard = document.getElementById("quizCard");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const lightshow = document.getElementById("lightshow");

/* ====================================================================
   AFFICHAGE D'UNE QUESTION
   ==================================================================== */
function renderQuestion() {
  answered = false;
  const item = questions[currentIndex];

  // Mise à jour progression
  const pct = (currentIndex / questions.length) * 100;
  progressBar.style.width = pct + "%";
  progressText.textContent = `Question ${currentIndex + 1} / ${questions.length}`;

  quizCard.innerHTML = `
    <span class="question-num">Question ${currentIndex + 1} / ${questions.length}</span>
    <div class="question-text">${item.q}</div>
    <div class="choices" id="choices">
      ${item.choices.map((c, i) => `
        <div class="choice" data-index="${i}" onclick="selectChoice(${i})">
          <div class="letter">${String.fromCharCode(65 + i)}</div>
          <div class="text">${c}</div>
        </div>
      `).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="correction" id="correction">
      <h3>Correction</h3>
      <p id="correctionText"></p>
    </div>
    <div class="actions">
      <button class="btn btn-next" id="nextBtn" disabled onclick="nextQuestion()">
        ${currentIndex === questions.length - 1 ? "Voir le résultat" : "Passer à la question suivante"}
      </button>
    </div>
  `;
}

/* ====================================================================
   SÉLECTION D'UN CHOIX
   ==================================================================== */
function selectChoice(i) {
  if (answered) return;
  answered = true;

  const item = questions[currentIndex];
  const choiceEls = document.querySelectorAll(".choice");
  const feedback = document.getElementById("feedback");
  const correction = document.getElementById("correction");
  const correctionText = document.getElementById("correctionText");
  const nextBtn = document.getElementById("nextBtn");

  // Marquer tous comme désactivés
  choiceEls.forEach(el => el.classList.add("disabled"));

  // Mettre en évidence la bonne réponse
  choiceEls[item.correct].classList.add("correct");

  const isCorrect = (i === item.correct);

  if (isCorrect) {
    choiceEls[i].classList.add("correct");
    feedback.className = "feedback show success";
    feedback.innerHTML = "🎉 BRAVO ! Excellente réponse ! 🎉";
    score++;
    playJoyMusic();
    launchLightShow();
  } else {
    choiceEls[i].classList.add("wrong");
    feedback.className = "feedback show error";
    feedback.innerHTML = "😔 Sorry, votre réponse est fausse.";
  }

  // Afficher la correction
  correctionText.innerHTML = `${item.correction} <br><span class="answer">Bonne réponse : ${item.choices[item.correct]}</span>`;
  correction.classList.add("show");

  nextBtn.disabled = false;
}

/* ====================================================================
   QUESTION SUIVANTE / RÉSULTAT
   ==================================================================== */
function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showFinal();
  }
}

function showFinal() {
  progressBar.style.width = "100%";
  progressText.textContent = "Terminé !";

  let msg = "";
  if (score >= 18) msg = "🌟 Excellent travail ! Vous maîtrisez parfaitement le programme.";
  else if (score >= 14) msg = "👍 Très bien ! Continuez ainsi.";
  else if (score >= 10) msg = "🙂 Bien, mais vous pouvez progresser encore.";
  else msg = "💪 Courage ! Reprenez les notions et réessayez.";

  quizCard.classList.add("final-card");
  quizCard.innerHTML = `
    <h2>🏁 Exercice terminé 🏁</h2>
    <p style="font-size:1.2rem;color:#555;">Vous avez répondu à toutes les questions.</p>
    <div class="score">${score} / ${questions.length}</div>
    <div class="msg">${msg}</div>
    <div class="actions">
      <button class="btn btn-restart" onclick="restart()">Recommencer l'exercice</button>
    </div>
  `;
  if (score >= 14) { playJoyMusic(); launchLightShow(); }
}

function restart() {
  currentIndex = 0;
  score = 0;
  quizCard.classList.remove("final-card");
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ====================================================================
   MUSIQUE DE JOIE (Web Audio API — sans fichier externe)
   ==================================================================== */
let audioCtx = null;
function playJoyMusic() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    // Mélodie joyeuse : Do, Mi, Sol, Do (octave sup) — fanfare
    const notes = [
      { f: 523.25, t: 0.00, d: 0.18 },  // Do5
      { f: 659.25, t: 0.18, d: 0.18 },  // Mi5
      { f: 783.99, t: 0.36, d: 0.18 },  // Sol5
      { f: 1046.50, t: 0.54, d: 0.35 }, // Do6
      { f: 783.99, t: 0.92, d: 0.16 },  // Sol5
      { f: 1046.50, t: 1.10, d: 0.45 }  // Do6 (final)
    ];

    const now = audioCtx.currentTime;
    notes.forEach(n => {
      // Oscillateur principal
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(n.f, now + n.t);
      // Enveloppe
      gain.gain.setValueAtTime(0, now + n.t);
      gain.gain.linearRampToValueAtTime(0.3, now + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.05);

      // Harmonique (octave supérieure, plus douce)
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(n.f * 2, now + n.t);
      gain2.gain.setValueAtTime(0, now + n.t);
      gain2.gain.linearRampToValueAtTime(0.12, now + n.t + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.start(now + n.t);
      osc2.stop(now + n.t + n.d + 0.05);
    });
  } catch (e) {
    console.warn("Audio non disponible :", e);
  }
}

/* ====================================================================
   JEU DE LUMIÈRE + CONFETTIS + ÉTOILES
   ==================================================================== */
const colors = ["#ff5252","#ffd740","#69f0ae","#40c4ff","#e040fb","#ff6e40","#b388ff","#00e676"];

function launchLightShow() {
  lightshow.classList.add("active");
  lightshow.innerHTML = "";

  const W = window.innerWidth;
  const H = window.innerHeight;

  // Bursts de cercles colorés
  for (let i = 0; i < 24; i++) {
    const l = document.createElement("div");
    l.className = "light";
    const size = 30 + Math.random() * 50;
    l.style.width = size + "px";
    l.style.height = size + "px";
    l.style.background = colors[i % colors.length];
    l.style.boxShadow = `0 0 30px ${colors[i % colors.length]}`;
    l.style.left = Math.random() * W + "px";
    l.style.top = Math.random() * H + "px";
    l.style.animation = `lightBurst ${0.8 + Math.random() * 0.6}s ease-out ${Math.random() * 0.4}s forwards`;
    lightshow.appendChild(l);
  }

  // Étoiles scintillantes qui montent
  const sparkles = ["★","✦","✧","✨","⭐"];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
    s.style.color = colors[i % colors.length];
    s.style.left = Math.random() * W + "px";
    s.style.top = (H * 0.5 + Math.random() * H * 0.5) + "px";
    s.style.animation = `sparkleFloat ${1.2 + Math.random() * 0.8}s ease-out ${Math.random() * 0.6}s forwards`;
    lightshow.appendChild(s);
  }

  // Confettis qui tombent
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = colors[i % colors.length];
    c.style.left = Math.random() * W + "px";
    c.style.top = "-20px";
    const dur = 1.5 + Math.random() * 1.2;
    const drift = (Math.random() - 0.5) * 200;
    c.style.animation = `confettiFall ${dur}s ease-in ${Math.random() * 0.5}s forwards`;
    c.style.setProperty("--drift", drift + "px");
    lightshow.appendChild(c);
  }

  // Ajouter dynamiquement l'animation confettiFall
  if (!document.getElementById("confettiStyle")) {
    const st = document.createElement("style");
    st.id = "confettiStyle";
    st.textContent = `
      @keyframes confettiFall {
        0% { opacity: 1; transform: translate(0,0) rotate(0deg); }
        100% { opacity: 0; transform: translate(var(--drift), ${H + 50}px) rotate(720deg); }
      }
    `;
    document.head.appendChild(st);
  }

  // Nettoyer après 3s
  setTimeout(() => {
    lightshow.classList.remove("active");
    lightshow.innerHTML = "";
  }, 3000);
}

/* ====================================================================
   COPIER LE CODE HTML DANS LE PRESSE-PAPIERS
   ==================================================================== */
function showToast(message, type) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = "toast show " + (type || "");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toast.className = "toast";
  }, 2500);
}

function copyHtmlCode() {
  // Récupère tout le code source HTML de la page (avec le DOCTYPE)
  const doctype = "<!DOCTYPE html>\n";
  const htmlContent = doctype + document.documentElement.outerHTML;

  // Méthode moderne : Clipboard API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(htmlContent)
      .then(() => {
        showToast("✅ Code HTML copié ! Collez-le où vous voulez.", "success");
      })
      .catch(() => {
        fallbackCopy(htmlContent);
      });
  } else {
    fallbackCopy(htmlContent);
  }
}

// Méthode de secours (anciens navigateurs / ouverture via file://)
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  ta.style.top = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    const ok = document.execCommand("copy");
    if (ok) {
      showToast("✅ Code HTML copié !", "success");
    } else {
      showToast("❌ Échec de la copie. Sélectionnez et copiez manuellement.", "error");
    }
  } catch (e) {
    showToast("❌ Copie impossible sur ce navigateur.", "error");
  }
  document.body.removeChild(ta);
}

/* ====================================================================
   DÉMARRAGE
   ==================================================================== */
renderQuestion();
</script>
